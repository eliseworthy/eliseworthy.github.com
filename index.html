<SCRIPT>
  // Scale all GIFs to the same height, preserving aspect ratio
  var TARGET_H = 70;
  var gifs = [
    { src: 'hamster-spins.gif', w: 54,  h: 70  },
    { src: 'b5K.gif',           w: 200, h: 200 },
    { src: 'squirrel.gif',      w: 117, h: 163 },
    { src: 'hamster-hammy.gif', w: 60,  h: 70  },
  ].map(function(g) {
    var scale = TARGET_H / g.h;
    return { src: g.src, w: Math.round(g.w * scale), h: TARGET_H };
  });

  // Row pattern matching original: anin, hamu, anin, gerbil, anin, hamwalk, anin, anin, hamu ...
  var pattern = [0, 1, 0, 2, 0, 3, 0, 1, 0, 2, 0, 3, 0, 1, 0, 2, 0, 3, 0];

  function buildRows() {
    var container = document.getElementById('dance-floor');
    container.innerHTML = '';
    var maxW = window.innerWidth;

    pattern.forEach(function(gifIdx) {
      var gif = gifs[gifIdx];
      var count = Math.floor(maxW / gif.w);
      if (count < 1) count = 1;

      var row = document.createElement('div');
      row.className = 'row';

      for (var i = 0; i < count; i++) {
        var img = document.createElement('img');
        img.src = gif.src;
        img.width = gif.w;
        img.height = gif.h;
        img.border = 0;
        row.appendChild(img);
      }
      container.appendChild(row);
    });
  }

  buildRows();
  window.addEventListener('resize', buildRows);

  // Start the music as soon as the page loads. Most browsers block sound
  // until the visitor interacts with the page; if that happens, show the
  // "click to dance" banner and start on the first click, tap, or keypress.
  var aud = document.getElementById('ded');
  var dancePrompt = document.getElementById('dance-prompt');
  var startEvents = ['pointerdown', 'click', 'keydown', 'touchstart'];
  function onStarted() {
    startEvents.forEach(function(e){ document.removeEventListener(e, tryPlay, true); });
    dancePrompt.style.display = 'none';
  }
  function tryPlay() {
    if (!aud.paused) { onStarted(); return; }
    var p = aud.play();
    if (p && p.then) p.then(onStarted).catch(function(err){
      if (err && err.name === 'NotAllowedError') dancePrompt.style.display = 'flex';
    });
  }
  startEvents.forEach(function(e){ document.addEventListener(e, tryPlay, true); });
  aud.addEventListener('playing', onStarted);
  tryPlay();
</SCRIPT>
